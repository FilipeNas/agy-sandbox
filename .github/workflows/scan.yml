name: Dependency Scan
run-name: ${{ github.event_name == 'schedule' && 'Daily Dependency Scan' || 'Manual Dependency Scan' }}

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE: ghcr.io/filipenas/agy-sandbox
  TRIVY_VERSION: v0.75.0

jobs:
  resolve:
    name: Resolve published digest
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve latest to an immutable reference
        id: image
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' | jq -er '.digest')"
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan linux/${{ matrix.architecture }}
    needs: resolve
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare dependency reports
        env:
          IMAGE_REF: ${{ needs.resolve.outputs.image }}
        run: |
          mkdir -p scan-results
          printf '%s\n' "$IMAGE_REF" > scan-results/image.txt

      - name: Scan published platform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.architecture }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ needs.resolve.outputs.image }}
          scanners: vuln
          format: json
          output: scan-results/vulnerabilities.json
          exit-code: '0'
          timeout: 15m

      - name: Format human-readable report and SARIF
        env:
          ARCH: ${{ matrix.architecture }}
          IMAGE_REF: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          trivy convert --scanners vuln --format table \
            --output scan-results/vulnerabilities.txt scan-results/vulnerabilities.json
          trivy convert --scanners vuln --format sarif \
            --output scan-results/vulnerabilities.sarif scan-results/vulnerabilities.json

          {
            printf '## Trivy Dependency Scan (`linux/%s`)\n\n' "$ARCH"
            printf '**Scanned image:** `%s`\n\n' "$IMAGE_REF"
            jq -r '
              def esc: tostring | gsub("\\|"; "\\|") | gsub("[\\r\\n]+"; " ");
              def sev_rank:
                if . == "CRITICAL" then 0
                elif . == "HIGH" then 1
                elif . == "MEDIUM" then 2
                elif . == "LOW" then 3
                else 4 end;
              ([.Results[]? | .Target as $t | .Vulnerabilities[]? | . + {_target: $t}] // []) as $v |
              "| Severity | Count |",
              "| --- | ---: |",
              "| CRITICAL | \([ $v[] | select(.Severity == "CRITICAL") ] | length) |",
              "| HIGH | \([ $v[] | select(.Severity == "HIGH") ] | length) |",
              "| MEDIUM | \([ $v[] | select(.Severity == "MEDIUM") ] | length) |",
              "| LOW | \([ $v[] | select(.Severity == "LOW") ] | length) |",
              "| UNKNOWN | \([ $v[] | select(.Severity == "UNKNOWN") ] | length) |",
              "| **Total** | **\($v | length)** |",
              "",
              if ($v | length) == 0 then
                "✅ No vulnerabilities detected."
              else
                "<details open><summary><strong>Vulnerabilities (\($v | length))</strong></summary>",
                "",
                "| Severity | Package | Vulnerability | Installed | Fixed | Target | Title |",
                "| --- | --- | --- | --- | --- | --- | --- |",
                ($v | sort_by([(.Severity | sev_rank), .PkgName, .VulnerabilityID])[] |
                  "| \(.Severity | esc) | `\(.PkgName | esc)` | \(.VulnerabilityID | esc) | `\(.InstalledVersion | esc)` | `\((.FixedVersion // "-") | esc)` | \(._target | esc) | \((.Title // "-") | esc) |"),
                "",
                "</details>"
              end
            ' scan-results/vulnerabilities.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scan-results/vulnerabilities.sarif
          category: trivy-linux-${{ matrix.architecture }}

      - name: Generate published platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.architecture }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: 'true'
          image-ref: ${{ needs.resolve.outputs.image }}
          format: cyclonedx
          output: scan-results/sbom.cdx.json
          exit-code: '0'
          timeout: 15m

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-reports-${{ matrix.architecture }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7
