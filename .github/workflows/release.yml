name: Release
run-name: Release Workload Kit

# Manual, main-only release:
# 1. Allocate <UTC date>.<counter> version.
# 2. Build, test (image + microVM E2E in parallel), sign, and publish via _build-push.yml.
# 3. Create the GitHub release and git tag.
# Concurrency serializes the entire chain so version allocation cannot race.

on:
  workflow_dispatch:

concurrency:
  group: agy-sandbox-release
  cancel-in-progress: false

permissions:
  contents: write # create the tag + GitHub Release
  packages: write # push workload kit to GHCR
  security-events: write # upload Trivy SARIF in _build-push.yml
  id-token: write # keyless sbx signing in _build-push.yml

env:
  IMAGE: ghcr.io/filipenas/agy-sandbox

jobs:
  version:
    name: Allocate release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Compute <date>.<counter>
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          # Highest existing counter for today's date across published releases.
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName)"
          max="$(jq --arg prefix "${date}." '[.[].tagName | select(startswith($prefix)) |
            ltrimstr($prefix) | select(test("^[0-9]+$")) | tonumber] | max // 0' <<< "$releases")"
          counter=$(( max + 1 ))
          echo "version=${date}.${counter}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: ${date}.${counter}"

  publish:
    name: Publish release kit
    needs: version
    uses: ./.github/workflows/_build-push.yml
    with:
      tags: ${{ needs.version.outputs.version }},latest
    secrets: inherit

  release:
    name: Create GitHub release
    needs: [version, publish]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create tag ${{ needs.version.outputs.version }} + GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="**Workload kit:** \`${IMAGE}:${VERSION}\`"
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$notes"
