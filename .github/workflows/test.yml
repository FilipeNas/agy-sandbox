name: Test
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Image Test' || github.event.pull_request.title }}

# Runs on pull requests to validate native images across architectures.
# Skips automatically when changes only touch CI or documentation.

on:
  pull_request:
    paths:
      - "agy-sandbox.yaml"
      - "agy-sandbox.dockerfile"
      - "context.md"
      - "files/**"
      - ".dockerignore"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Test ${{ matrix.platform }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_slug: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint test scripts
        run: shellcheck tests/*.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # docker/sandbox-kit:3 (v3.0.0-m.8) drops CacheImports when staging
      # agent-context@1 contentFile. Pre-solving agy-sandbox.dockerfile with
      # type=cacheonly imports the GHA cache into the local BuildKit worker.
      - name: Warm BuildKit cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agy-sandbox.dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.platform_slug }}

      - name: Build native kit without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agy-sandbox.yaml
          platforms: ${{ matrix.platform }}
          load: true
          tags: agy-sandbox:test
          cache-from: type=gha,scope=${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_slug }}

      - name: Test native image
        run: bash tests/image.sh agy-sandbox:test
