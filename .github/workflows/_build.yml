name: _build

# Reusable build — the SINGLE SOURCE OF TRUTH for building and pushing BOTH the
# multi-arch image AND the kit OCI artifact to GHCR. build-and-push.yml
# (main/nightly) and release.yml (dated) call this via `workflow_call`.
#
#   image:  ghcr.io/filipenas/agy-sandbox
#   kit:    ghcr.io/filipenas/agy-sandbox-kit
#
# Every tag in `inputs.tags` (comma-separated) is applied to both, overwriting.
# The image builds on each arch's OWN native runner (no QEMU); a merge job
# stitches the per-arch digests into one manifest list.
#
# GitHub Actions cache (type=gha, per-arch scope) — no setup, GITHUB_TOKEN grants it.
# Actions are pinned to a commit SHA with the human-readable version in a comment.
#
# Signing: the merge job signs the index digest keyless with cosign (Sigstore
# Fulcio + Rekor, identity from the GitHub OIDC token). Callers MUST grant
# `id-token: write` — a reusable workflow cannot exceed its caller's permissions.

on:
  workflow_call:
    inputs:
      tags:
        description: "Comma-separated tags for image + kit, e.g. 'latest' or '2026-08-04.1,latest'"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/filipenas/agy-sandbox
  KIT: ghcr.io/filipenas/agy-sandbox-kit

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize platform name
        id: plat
        run: echo "name=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agy-sandbox.yaml
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.plat.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.plat.outputs.name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.plat.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign: OIDC token -> Fulcio certificate
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push (applies every tag, overwriting)
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          for t in "${TAGS[@]}"; do
            t="$(echo "$t" | xargs)"   # trim whitespace
            [ -n "$t" ] && args+=(-t "${IMAGE}:${t}" -t "${KIT}:${t}")
          done
          docker buildx imagetools create "${args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Resolve index digest
        id: index
        run: |
          set -euo pipefail
          first="$(echo "${{ inputs.tags }}" | cut -d, -f1 | xargs)"
          docker buildx imagetools inspect "${IMAGE}:${first}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${first}" \
                      --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Index digest: ${digest}"

      # Sign the DIGEST, never a tag (tags move). Image and kit share one index,
      # but signatures live per repository, so sign both. --recursive also signs
      # each per-platform manifest, so verifying a platform digest works too.
      # Identity = this reusable workflow (_build.yml) at the caller's ref.
      - name: Sign image + kit (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}" "${KIT}@${DIGEST}"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          for ref in "${IMAGE}@${DIGEST}" "${KIT}@${DIGEST}"; do
            cosign verify "$ref" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/_build.yml@${{ github.ref }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
            echo "verified: $ref"
          done
