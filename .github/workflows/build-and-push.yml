name: build-and-push

# Builds and publishes ghcr.io/filipenas/agy-sandbox:latest and :nightly.
# Triggers:
# - push to main / manual dispatch: tags 'latest'
# - schedule (nightly at 03:00 UTC): tags 'nightly,latest'
# Delegates the build, tests (image + microVM E2E in parallel), and signing to _build-push.yml.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write # keyless sbx signing in _build-push.yml

jobs:
  publish:
    name: Publish latest or nightly
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-push.yml
    with:
      tags: ${{ github.event_name == 'schedule' && 'nightly,latest' || 'latest' }}
    secrets: inherit

