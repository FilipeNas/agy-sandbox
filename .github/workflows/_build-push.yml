name: Build, Test and Sign

# Shared publisher for build-and-push.yml and release.yml.
# Native builds -> image tests -> dependency reports -> merge -> sign and verify.
# Publishes one workload kit: ghcr.io/filipenas/agy-sandbox.
# Callers must grant id-token: write for native sbx keyless signing.

on:
  workflow_call:
    inputs:
      tags:
        description: "Comma-separated workload kit tags, e.g. 'latest' or '2026-08-04.1,latest'"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/filipenas/agy-sandbox
  TRIVY_VERSION: v0.75.0

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_slug: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lint test scripts
        run: shellcheck tests/*.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agy-sandbox.yaml
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_slug }}

      - name: Verify kit descriptor and pull image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${BUILD_DIGEST}"
          architecture="${PLATFORM#linux/}"
          docker buildx imagetools inspect "$ref" --raw > "$RUNNER_TEMP/native-manifest.json"
          if jq -e 'has("manifests")' "$RUNNER_TEMP/native-manifest.json" > /dev/null; then
            digest="$(jq -er --arg arch "$architecture" '[.manifests[] |
              select(.platform.os == "linux" and .platform.architecture == $arch)] |
              if length == 1 then .[0].digest else error("expected one native manifest") end' \
              "$RUNNER_TEMP/native-manifest.json")"
            docker buildx imagetools inspect "${IMAGE}@${digest}" --raw > "$RUNNER_TEMP/native-manifest.json"
          fi
          jq -e '.annotations["vnd.docker.sandbox.kit.descriptor"] | fromjson |
            .kind == "workload" and .schemaVersion == "3" and
            (.provides | index("agy") != null) and
            ([.capabilities[].type] | contains([
              "com.docker.sandbox/agent-context@1", "com.docker.sandbox/credential@1",
              "com.docker.sandbox/lifecycle@1", "com.docker.sandbox/network-policy@1"
            ]))' "$RUNNER_TEMP/native-manifest.json" > /dev/null
          docker pull --platform "$PLATFORM" "$ref"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$architecture"

      - name: Test native image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/image.sh "${IMAGE}@${BUILD_DIGEST}"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Prepare dependency reports
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p scan-results
          printf '%s\n' "${IMAGE}@${BUILD_DIGEST}" > scan-results/image.txt

      - name: Scan native image dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'
          format: json
          output: scan-results/vulnerabilities.json
          exit-code: '0'
          timeout: 15m

      - name: Format human-readable report and SARIF
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trivy convert --scanners vuln --severity CRITICAL,HIGH --format table \
            --output scan-results/vulnerabilities.txt scan-results/vulnerabilities.json
          trivy convert --scanners vuln --severity CRITICAL,HIGH --format sarif \
            --output scan-results/vulnerabilities.sarif scan-results/vulnerabilities.json

          {
            printf '## Trivy Dependency Scan (`%s`)\n\n' "$PLATFORM"
            printf '**Scanned image:** `%s`\n\n' "$IMAGE_REF"
            jq -r '
              def esc: tostring | gsub("\\|"; "\\|") | gsub("[\\r\\n]+"; " ");
              def sev_rank:
                if . == "CRITICAL" then 0
                else 1 end;
              ([.Results[]? | .Target as $t | .Vulnerabilities[]? | . + {_target: $t}] // []) as $v |
              "| Severity | Count |",
              "| --- | ---: |",
              "| CRITICAL | \([ $v[] | select(.Severity == "CRITICAL") ] | length) |",
              "| HIGH | \([ $v[] | select(.Severity == "HIGH") ] | length) |",
              "| **Total** | **\($v | length)** |",
              "",
              if ($v | length) == 0 then
                "✅ No CRITICAL or HIGH vulnerabilities detected."
              else
                "<details open><summary><strong>Vulnerabilities (\($v | length))</strong></summary>",
                "",
                "| Severity | Package | Vulnerability | Installed | Fixed | Target | Title |",
                "| --- | --- | --- | --- | --- | --- | --- |",
                ($v | sort_by([(.Severity | sev_rank), .PkgName, .VulnerabilityID])[] |
                  "| \(.Severity | esc) | `\(.PkgName | esc)` | \(.VulnerabilityID | esc) | `\(.InstalledVersion | esc)` | `\((.FixedVersion // "-") | esc)` | \(._target | esc) | \((.Title // "-") | esc) |"),
                "",
                "</details>"
              end
            ' scan-results/vulnerabilities.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scan-results/vulnerabilities.sarif
          category: trivy-${{ matrix.platform_slug }}

      - name: Generate native image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: 'true'
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: scan-results/sbom.cdx.json
          exit-code: '0'
          timeout: 15m

      - name: Upload dependency reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-reports-${{ matrix.platform_slug }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Test amd64 sbx microVM
    if: vars.DOCKER_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM access
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo -n tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo -n udevadm control --reload-rules
          sudo -n udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Enable containerd image store
        run: |
          set -euo pipefail
          if [ -s /etc/docker/daemon.json ]; then
            sudo -n jq '. + {"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json \
              | sudo -n tee /etc/docker/daemon.json.tmp > /dev/null
            sudo -n mv /etc/docker/daemon.json.tmp /etc/docker/daemon.json
          else
            sudo -n mkdir -p /etc/docker
            echo '{"features": {"containerd-snapshotter": true}}' | sudo -n tee /etc/docker/daemon.json > /dev/null
          fi
          sudo -n systemctl restart docker
          docker info -f '{{ .DriverStatus }}'

      - name: Install full Docker Sandboxes runtime
        env:
          SBX_VERSION: v0.47.0
          SBX_SHA256: a89cb4380075ebb20938103bc98ec63327fbeabe43a71f0575ddb285a051eab4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/sbx.tar.gz"
          printf '%s  %s\n' "$SBX_SHA256" "$RUNNER_TEMP/sbx.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sbx-runtime"
          tar -xzf "$RUNNER_TEMP/sbx.tar.gz" -C "$RUNNER_TEMP/sbx-runtime"
          sudo -n env PREFIX=/usr/local bash "$RUNNER_TEMP/sbx-runtime/docker-sbx/install.sh"
          echo /usr/local/bin >> "$GITHUB_PATH"

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          sbx version
          docker info > /dev/null
          shellcheck tests/e2e.sh

      - name: Authenticate Docker Sandboxes
        id: login
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PAT"
          printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin

      - name: Test workload kit
        run: bash tests/e2e.sh

      - name: Sign out on ephemeral runner
        if: ${{ always() && steps.login.outcome == 'success' }}
        run: sbx logout --yes

  merge:
    name: Publish and sign multi-platform kit
    needs: [build, e2e]
    if: always() && needs.build.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: agy-sandbox-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # keyless sbx signing: OIDC token -> Fulcio certificate
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install sbx CLI
        env:
          SBX_VERSION: v0.47.0
          SBX_SHA256: 6a3c45df52ff32722bb33e4d2c66f9920e284b9a3adeba17afcfcea3ad346eff
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux-arm64.tar.gz" \
            -o "$RUNNER_TEMP/sbx.tar.gz"
          printf '%s  %s\n' "$SBX_SHA256" "$RUNNER_TEMP/sbx.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sbx-bin"
          tar -xzf "$RUNNER_TEMP/sbx.tar.gz" --strip-components=1 \
            -C "$RUNNER_TEMP/sbx-bin" docker-sbx/sbx
          echo "$RUNNER_TEMP/sbx-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sbx-bin/sbx" version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push (applies every tag, overwriting)
        id: index
        working-directory: /tmp/digests
        env:
          PUBLISH_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra tags <<< "$PUBLISH_TAGS"
          for tag in "${tags[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -n "$tag" ] && args+=(-t "${IMAGE}:${tag}")
          done
          test "${#args[@]}" -gt 0
          sources=()
          for digest_file in *; do
            sources+=("${IMAGE}@sha256:${digest_file}")
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/kit-index.json" "${args[@]}" \
            "${sources[@]}"
          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/kit-index.json")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Index digest: ${digest}"

      - name: Sign and verify workload kit with sbx
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/_build-push.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --raw > "$RUNNER_TEMP/kit-index-manifest.json"
          jq -er '.manifests[] | select(.platform.os == "linux" and
            (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest' \
            "$RUNNER_TEMP/kit-index-manifest.json" > "$RUNNER_TEMP/kit-signing-digests"
          test "$(wc -l < "$RUNNER_TEMP/kit-signing-digests")" -eq 2
          printf '%s\n' "$INDEX_DIGEST" >> "$RUNNER_TEMP/kit-signing-digests"
          while IFS= read -r digest; do
            ref="${IMAGE}@${digest}"
            sbx kit sign "$ref"
            sbx kit verify "$ref" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            echo "verified: $ref"
          done < "$RUNNER_TEMP/kit-signing-digests"
