# syntax=docker/sandbox-kit:3
schemaVersion: '3'
displayName: agy-sandbox
description: Docker Sandbox for Google Antigravity CLI (agy)
author: Filipe Nascimento <piposantos1@hotmail.com>

kind: workload
version: 0.1.0

provides:
  - agy
  - antigravity

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - '*'

  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google OAuth session used by Antigravity CLI
    config:
      service: antigravity
      phase: runtime
      oauth:
        tokenEndpoint:
          host: oauth2.googleapis.com
          path: /token
        resourceHosts:
          - aicode.googleapis.com
          - cloudaicompanion.googleapis.com
          - cloudcode-pa.googleapis.com
          - daily-cloudcode-pa.googleapis.com
          - generativelanguage.googleapis.com
          - www.googleapis.com
        sentinels:
          accessToken: agy-oauth-access-proxy-managed
          refreshToken: agy-oauth-refresh-proxy-managed
        credentialFile:
          path: ~/.gemini/antigravity-cli/antigravity-oauth-token
          structure:
            token:
              access_token: '{{.AccessToken}}'
              token_type: Bearer
              refresh_token: '{{.RefreshToken}}'
              expiry: '9999-12-31T23:59:59Z'
            auth_method: consumer

  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./context.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            python3 -c '
            import json, os
            p = os.path.expanduser("~/.gemini/antigravity-cli/settings.json")
            try:
                with open(p, "r") as f:
                    d = json.load(f)
            except Exception:
                d = {}
            ws = os.environ.get("WORKSPACE_DIR") or "/workspace"
            trusted = d.get("trustedWorkspaces", [])  
            if ws and ws not in trusted:
                trusted.append(ws)
            d["trustedWorkspaces"] = trusted
            os.makedirs(os.path.dirname(p), exist_ok=True)
            with open(p, "w") as f:
                json.dump(d, f, indent=2)
            os.chmod(p, 0o600)
            '
          user: agent
          env: [WORKSPACE_DIR]
          description: Automatically append workspace directory to trustedWorkspaces
